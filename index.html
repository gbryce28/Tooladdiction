<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen & Mood</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app">
    <main class="mobile-root">
      <header class="mobile-header">
        <h1>Daily Mood</h1>
        <p class="sub">Quick check-in — tap how you feel today</p>
      </header>

      <section class="mood-area">
        <div class="mood-scale" id="moodScale">
          <button class="mood-option" data-mood="1"><span class="mood-label">Terrible</span></button>
          <button class="mood-option" data-mood="2"><span class="mood-label">Bad</span></button>
          <button class="mood-option" data-mood="3"><span class="mood-label">Okay</span></button>
          <button class="mood-option" data-mood="4"><span class="mood-label">Good</span></button>
          <button class="mood-option" data-mood="5"><span class="mood-label">Great</span></button>
        </div>

        <div class="mood-actions">
          <button id="saveBtn" class="btn btn-primary" disabled>Save Mood</button>
          <button id="exampleDataBtn" class="btn btn-secondary">Load Example Data</button>
        </div>
      </section>

      <section class="graph-section">
        <h2>Recent Mood</h2>
        <div class="graph-container-medium" id="graphContainer">
          <canvas id="moodGraph"></canvas>
          <div class="graph-overlay">Click to expand</div>
        </div>
        <div class="today-summary">
          <div class="summary-card">
            <span class="summary-label">Days Tracked</span>
            <span class="summary-value" id="daysTracked">0</span>
          </div>
          <div class="summary-card">
            <span class="summary-label">Avg Mood</span>
            <span class="summary-value" id="avgMoodStat">—</span>
          </div>
        </div>
      </section>

      <!-- Graph Expansion Modal -->
      <div id="graphModal" class="graph-modal" style="display: none;">
        <div class="graph-modal-backdrop"></div>
        <div class="graph-modal-content">
          <div class="graph-modal-header">
            <h2>Mood Trend</h2>
            <button id="closeGraphModal" class="graph-modal-close" aria-label="Close">×</button>
          </div>
          <div class="graph-modal-body">
            <canvas id="expandedMoodGraph"></canvas>
            <div class="graph-legend">
              <div class="legend-item">
                <span class="legend-indicator peak"></span>
                <span class="legend-text">Peak (Great)</span>
              </div>
              <div class="legend-item">
                <span class="legend-indicator mean"></span>
                <span class="legend-text">Mean Line</span>
              </div>
              <div class="legend-item">
                <span class="legend-indicator trough"></span>
                <span class="legend-text">Trough (Terrible)</span>
              </div>
              <div class="legend-item">
                <span class="legend-indicator trough-distance"></span>
                <span class="legend-text">Trough Distance</span>
              </div>
            </div>
          </div>
          <div class="graph-modal-stats">
            <div class="stat-item">
              <span class="stat-label">Highest</span>
              <span class="stat-value" id="modalHighest">—</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Lowest</span>
              <span class="stat-value" id="modalLowest">—</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Average</span>
              <span class="stat-value" id="modalAverage">—</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Streak</span>
              <span class="stat-value" id="modalStreak">—</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Bad Day</span>
              <span class="stat-value" id="modalBadDay">—</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Good Day</span>
              <span class="stat-value" id="modalGoodDay">—</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Trough Count</span>
              <span class="stat-value" id="modalTroughCount">—</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Peak Count</span>
              <span class="stat-value" id="modalPeakCount">—</span>
            </div>
          </div>
        </div>
      </div>
      <section class="beta-footer" aria-hidden="false">
        <div class="beta-buttons">
          <button id="nextDayBtn" class="btn btn-secondary">Advance Day (Beta)</button>
          <button id="undoBtn" class="btn btn-secondary">Undo Last</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Load modules -->
  <script src="src/screen/dataModel.js"></script>
  <script src="src/screen/graphRenderer.js"></script>
  <script src="main.js"></script>
  <script src="src/chart-expansion.js"></script>
</body>
</html>
